<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">HomeFusion</title>
  <desc id="description">A simple home and media rows icon above the HomeFusion name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151b32"/>
      <stop offset="1" stop-color="#090c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>

  <g transform="translate(640 360) scale(1.15) translate(-640 -288.5)">
  <g transform="translate(520 90)">
