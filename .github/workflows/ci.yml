name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: dotnet test tests/HomeFusion.Tests/HomeFusion.Tests.csproj -c Release
      - run: npm ci
      - run: npm run check && npm test
      - run: dotnet build Jellyfin.Plugin.HomeFusion/Jellyfin.Plugin.HomeFusion.csproj -c Release -t:PackagePlugin
      - uses: actions/upload-artifact@v7
        with:
          name: HomeFusion
          path: artifacts/*.zip